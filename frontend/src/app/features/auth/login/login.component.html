<div class="min-h-screen flex items-center justify-center bg-base-200 p-4">
  <div class="card w-full max-w-sm shadow-2xl bg-base-100">
    <div class="card-body">
      <h2 class="text-2xl font-bold text-center mb-4">Witaj w Messy! 👋</h2>

      <form>
        <div class="form-control">
          <label class="label">
            <span class="label-text">Email</span>
          </label>
          <input type="email" placeholder="email@example.com" class="input input-bordered w-full" required />
        </div>

        <div class="form-control mt-4">
          <label class="label">
            <span class="label-text">Hasło</span>
          </label>
          <input type="password" placeholder="••••••••" class="input input-bordered w-full" required />
          <label class="label">
            <a href="#" class="label-text-alt link link-hover">Zapomniałeś hasła?</a>
          </label>
        </div>

        <div class="form-control mt-6">
          <button type="button" class="btn btn-primary w-full">Zaloguj się</button>
        </div>
      </form>

      <div class="divider">LUB</div>

      <div class="text-center mt-2">
        <span class="text-sm">Nie masz jeszcze konta? </span>
        <a routerLink="/register" class="link link-primary text-sm font-semibold">Zarejestruj się</a>
      </div>
    </div>
  </div>
</div>
