<div class="min-h-screen flex items-center justify-center bg-base-200 p-4">
  <div class="card w-full max-w-sm shadow-2xl bg-base-100">
    <div class="card-body">
      <h2 class="text-2xl font-bold text-center mb-4">Stwórz konto 🚀</h2>

      <form>
        <div class="form-control">
          <label class="label">
            <span class="label-text">Nazwa użytkownika</span>
          </label>
          <input type="text" placeholder="np. jkowalski" class="input input-bordered w-full" required />
        </div>

        <div class="form-control mt-4">
          <label class="label">
            <span class="label-text">Email</span>
          </label>
          <input type="email" placeholder="email@example.com" class="input input-bordered w-full" required />
        </div>

        <div class="form-control mt-4">
          <label class="label">
            <span class="label-text">Hasło</span>
          </label>
          <input type="password" placeholder="••••••••" class="input input-bordered w-full" required />
        </div>

        <div class="form-control mt-6">
          <button type="button" class="btn btn-primary w-full">Zarejestruj się</button>
        </div>
      </form>

      <div class="text-center mt-6">
        <span class="text-sm">Masz już konto? </span>
        <a routerLink="/login" class="link link-primary text-sm font-semibold">Zaloguj się</a>
      </div>
    </div>
  </div>
</div>
